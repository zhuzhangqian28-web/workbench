<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#c7d2fe">
<title>我的专属工作台</title>
<style>
:root{--blue:#3b82f6;--pink:#ec4899;--green:#10b981;--orange:#f59e0b;--purple:#8b5cf6;--red:#ef4444;
--glass:rgba(255,255,255,0.55);--glass-strong:rgba(255,255,255,0.72);--glass-light:rgba(255,255,255,0.38);
--glass-border:rgba(255,255,255,0.6);--text:#1e293b;--text-light:#475569;--text-grey:#94a3b8;
--radius:20px;--radius-sm:14px;--radius-lg:28px;
--shadow:0 8px 32px rgba(99,102,241,0.08);--shadow-lg:0 12px 48px rgba(99,102,241,0.12);
--blur:blur(24px);--blur-light:blur(16px);--sidebar-w:240px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
background:linear-gradient(135deg,#c7d2fe 0%,#e9d5ff 25%,#dbeafe 55%,#fce7f3 100%);
background-attachment:fixed;color:var(--text);font-size:14px;display:flex;position:relative}
body::before{content:'';position:fixed;top:-10%;left:-8%;width:480px;height:480px;background:radial-gradient(circle,rgba(139,92,246,0.18) 0%,transparent 70%);border-radius:50%;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-12%;right:-8%;width:560px;height:560px;background:radial-gradient(circle,rgba(59,130,246,0.15) 0%,transparent 70%);border-radius:50%;pointer-events:none;z-index:0}
.sidebar{width:var(--sidebar-w);height:calc(100vh - 28px);margin:14px 0 14px 14px;
background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
border:1px solid var(--glass-border);border-radius:var(--radius-lg);
box-shadow:var(--shadow-lg);display:flex;flex-direction:column;flex-shrink:0;z-index:100;
transition:transform .3s;position:relative;overflow:hidden}
.sidebar-header{padding:24px 20px 16px;position:relative}
.sidebar-header .avatar{width:56px;height:56px;border-radius:50%;
background:linear-gradient(135deg,#a78bfa,#f472b6);
display:flex;align-items:center;justify-content:center;margin-bottom:12px;
box-shadow:0 4px 16px rgba(167,139,250,0.35)}
.sidebar-header h1{font-size:17px;font-weight:700;color:var(--text)}
.sidebar-header p{font-size:11px;margin-top:3px;color:var(--text-grey)}
.nav{flex:1;padding:8px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;cursor:pointer;
color:var(--text-light);font-size:13px;font-weight:600;transition:all .25s;margin-bottom:4px;border:1px solid transparent}
.nav-item:hover{background:rgba(255,255,255,0.4);color:var(--text)}
.nav-item.active{background:rgba(255,255,255,0.85);color:var(--text);border-color:rgba(255,255,255,0.9);
box-shadow:0 4px 20px rgba(99,102,241,0.12)}
.nav-item .nav-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,0.08)}
.sidebar-footer{padding:12px 16px 18px;text-align:center}
.sidebar-backup{margin:6px 12px 2px;padding:12px;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.65);border-radius:16px;box-shadow:0 4px 16px rgba(80,80,160,0.08)}
.sidebar-backup .backup-title{font-size:11px;font-weight:600;color:rgba(71,85,105,0.7);margin-bottom:8px;text-align:center}
.sidebar-backup .backup-btns{display:flex;gap:8px}
.sidebar-backup .backup-btn{flex:1;padding:8px 0;border:none;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#818cf8,#a78bfa);color:#fff;box-shadow:0 3px 10px rgba(129,140,248,0.25);transition:all .15s}
.sidebar-backup .backup-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(129,140,248,0.35)}
.sidebar-backup .backup-tip{font-size:10px;color:rgba(71,85,105,0.55);margin-top:7px;text-align:center;line-height:1.4}
.main{flex:1;height:calc(100vh - 28px);margin:14px 14px 14px 0;
background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
border:1px solid var(--glass-border);border-radius:var(--radius-lg);
box-shadow:var(--shadow-lg);overflow:hidden;position:relative;z-index:1;
display:flex;flex-direction:column}
.update-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;
background:rgba(255,255,255,0.3);backdrop-filter:var(--blur-light);-webkit-backdrop-filter:var(--blur-light);
border-bottom:1px solid rgba(255,255,255,0.4);flex-shrink:0;gap:10px}
.update-bar .today-label{font-size:14px;font-weight:700;color:var(--text)}
.update-bar .update-info{font-size:11px;color:var(--text-grey);margin-top:2px}
.update-btn{padding:9px 20px;background:linear-gradient(135deg,#818cf8,#a78bfa);color:#fff;
border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;
white-space:nowrap;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(129,140,248,0.35)}
.update-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(129,140,248,0.45)}
.update-btn.spinning{animation:spin .8s linear infinite;pointer-events:none;opacity:.7}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.main-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{display:none;padding:24px}
.page.active{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-header{margin-bottom:20px}
.page-header h2{font-size:22px;font-weight:800;color:var(--text)}
.page-header .date{font-size:12px;color:var(--text-grey);margin-top:4px}
.card{background:var(--glass);backdrop-filter:var(--blur-light);-webkit-backdrop-filter:var(--blur-light);
border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);
padding:18px;margin-bottom:14px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card-title{font-size:14px;font-weight:700;margin-bottom:6px;line-height:1.5;color:var(--text)}
.card-desc{font-size:12px;color:var(--text-light);line-height:1.6;margin-bottom:8px}
.card-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-grey);margin-bottom:8px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:8px;font-size:10px;font-weight:700}
.badge-blue{background:rgba(59,130,246,0.15);color:#2563eb}.badge-pink{background:rgba(236,72,153,0.15);color:#db2777}.badge-green{background:rgba(16,185,129,0.15);color:#059669}.badge-orange{background:rgba(245,158,11,0.15);color:#d97706}.badge-purple{background:rgba(139,92,246,0.15);color:#7c3aed}.badge-red{background:rgba(239,68,68,0.15);color:#dc2626}
.search-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,0.05)}
.search-btn{padding:5px 12px;border-radius:10px;font-size:11px;font-weight:600;text-decoration:none;color:var(--text-light);background:rgba(255,255,255,0.4);transition:all .15s;border:1px solid rgba(255,255,255,0.5)}
.search-btn:hover{color:#fff;background:rgba(0,0,0,0.7)}
.search-btn:nth-child(1):hover{background:#000}.search-btn:nth-child(2):hover{background:#FF2442}.search-btn:nth-child(3):hover{background:#00A1D6}.search-btn:nth-child(4):hover{background:#E6162D}.search-btn:nth-child(5):hover{background:#0066FF}.search-btn:nth-child(6):hover{background:#2932E1}
.loading{text-align:center;padding:30px;color:var(--text-grey);font-size:13px}
.quote-card{background:linear-gradient(135deg,rgba(255,255,255,0.7),rgba(255,255,255,0.5));
backdrop-filter:var(--blur-light);border:1px solid var(--glass-border);color:var(--text);
border-radius:var(--radius);padding:26px;margin-bottom:16px;position:relative;overflow:hidden}
.quote-card::before{content:'\201C';position:absolute;top:-10px;right:16px;font-size:80px;color:rgba(139,92,246,0.1);font-family:Georgia,serif}
.quote-card .quote-text{font-size:17px;font-weight:700;line-height:1.6;margin-bottom:8px;position:relative}
.quote-card .quote-from{font-size:12px;color:var(--text-grey)}
.word-card{background:var(--glass);backdrop-filter:var(--blur-light);-webkit-backdrop-filter:var(--blur-light);
border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);
padding:22px;margin-bottom:14px;border-left:4px solid var(--purple)}
.word-card .word-en{font-size:22px;font-weight:800;color:#7c3aed}
.word-card .word-phonetic{font-size:13px;color:var(--text-grey);margin-top:2px}
.word-card .word-cn{font-size:14px;color:var(--text);margin-top:8px;line-height:1.6}
.word-card .word-example{font-size:12px;color:var(--text-light);margin-top:8px;font-style:italic;line-height:1.6}
.word-card .word-extra{font-size:11px;color:var(--text-light);margin-top:10px;padding-top:10px;border-top:1px dashed rgba(0,0,0,0.08);line-height:1.8}
.word-card .word-extra b{color:#7c3aed}
.speak-card{background:var(--glass);backdrop-filter:var(--blur-light);-webkit-backdrop-filter:var(--blur-light);
border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);
padding:20px;margin-bottom:14px;border-left:4px solid var(--blue)}
.speak-card .speak-en{font-size:16px;font-weight:700;line-height:1.6;margin-bottom:6px;color:var(--text)}
.speak-card .speak-cn{font-size:13px;color:var(--text-light);line-height:1.6;margin-bottom:8px}
.speak-card .speak-tip{font-size:11px;color:var(--text-light);padding:10px 12px;background:rgba(255,255,255,0.35);border-radius:10px;line-height:1.6;margin-top:8px}
.speak-card .speak-tip b{color:#2563eb}
.play-btn{display:inline-flex;align-items:center;gap:4px;padding:8px 18px;
background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:12px;
font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;margin-top:8px;box-shadow:0 3px 12px rgba(59,130,246,0.3)}
.play-btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(59,130,246,0.4)}
.play-btn.playing{background:linear-gradient(135deg,#f59e0b,#f97316)}
.listen-card{background:var(--glass);backdrop-filter:var(--blur-light);-webkit-backdrop-filter:var(--blur-light);
border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);
padding:20px;margin-bottom:14px;border-left:4px solid var(--green)}
.listen-card .listen-passage{font-size:14px;line-height:1.8;color:var(--text);background:rgba(255,255,255,0.35);padding:16px;border-radius:12px;margin-bottom:10px;display:none}
.listen-card .listen-passage.show{display:block}
.quiz-box{background:var(--glass);backdrop-filter:var(--blur-light);-webkit-backdrop-filter:var(--blur-light);
border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);
padding:20px;margin-bottom:14px;border-left:4px solid var(--green)}
.quiz-q{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text)}
.quiz-opt{display:block;width:100%;text-align:left;padding:11px 16px;margin-bottom:8px;
border:1px solid rgba(255,255,255,0.5);border-radius:12px;background:rgba(255,255,255,0.35);
color:var(--text);font-size:13px;cursor:pointer;transition:all .15s}
.quiz-opt:hover{border-color:var(--blue);background:rgba(255,255,255,0.55)}
.quiz-opt.correct{border-color:var(--green);background:rgba(16,185,129,0.15);color:#059669}
.quiz-opt.wrong{border-color:var(--red);background:rgba(239,68,68,0.15);color:#dc2626}
.quiz-opt:disabled{cursor:default}
.quiz-explain{font-size:11px;color:var(--text-light);padding:10px 12px;background:rgba(255,255,255,0.35);border-radius:10px;margin-top:8px;line-height:1.6;display:none}
.quiz-explain.show{display:block}
.quiz-score{background:linear-gradient(135deg,rgba(255,255,255,0.7),rgba(255,255,255,0.5));
border:1px solid var(--glass-border);color:var(--text);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:14px}
.quiz-score .score-num{font-size:36px;font-weight:800;color:#7c3aed}
.quiz-score .score-label{font-size:12px;color:var(--text-grey);margin-top:4px}
.fitness-day{background:var(--glass);backdrop-filter:var(--blur-light);-webkit-backdrop-filter:var(--blur-light);
border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);
padding:18px;margin-bottom:14px;border-left:4px solid var(--green)}
.fitness-day.today{border-left-color:var(--orange);background:rgba(245,158,11,0.08)}
.fitness-day .day-name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--text)}
.fitness-day .day-focus{font-size:12px;color:var(--text-light);margin-top:4px}
.fitness-day .day-detail{font-size:12px;color:var(--text);margin-top:8px;line-height:1.8;background:rgba(255,255,255,0.35);padding:12px;border-radius:10px}
.fitness-day .day-tip{font-size:11px;color:#d97706;margin-top:6px}
.fitness-day .day-cal{font-size:11px;color:#059669;margin-top:4px}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px}
.summary-item{background:var(--glass);backdrop-filter:var(--blur-light);-webkit-backdrop-filter:var(--blur-light);
border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);
padding:18px;text-align:center;cursor:pointer;transition:all .2s}
.summary-item:hover{transform:translateY(-3px);background:var(--glass-strong);box-shadow:var(--shadow-lg)}
.summary-item .num{font-size:26px;font-weight:800}
.summary-item .label{font-size:11px;color:var(--text-grey);margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.tab{padding:8px 18px;border-radius:14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
background:rgba(255,255,255,0.35);color:var(--text-light);border:1px solid rgba(255,255,255,0.4);transition:all .2s}
.tab:hover{background:rgba(255,255,255,0.55);color:var(--text)}
.tab.active{background:linear-gradient(135deg,#818cf8,#a78bfa);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(129,140,248,0.3)}
.divider{font-size:14px;font-weight:800;color:var(--text);margin:18px 0 10px;padding-left:4px;display:flex;align-items:center;gap:6px}
.rating{display:inline-flex;gap:1px;font-size:11px}
.rating .star-on{color:#f59e0b}.rating .star-off{color:rgba(0,0,0,0.12)}
.todo-item{display:flex;align-items:center;gap:10px;padding:12px 16px;
background:rgba(255,255,255,0.4);backdrop-filter:var(--blur-light);
border:1px solid var(--glass-border);border-radius:14px;box-shadow:var(--shadow);
margin-bottom:8px;cursor:pointer;transition:all .15s}
.todo-item:hover{transform:translateX(3px);background:rgba(255,255,255,0.6)}
.todo-item .checkbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;transition:all .15s}
.todo-item.done .checkbox{background:var(--blue)}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-grey)}
.todo-item .todo-text{font-size:13px;flex:1;color:var(--text)}
.todo-item .todo-del{font-size:14px;color:var(--text-grey);opacity:0;transition:opacity .15s;cursor:pointer}
.todo-item:hover .todo-del{opacity:1}
.todo-add{display:flex;gap:8px;margin-bottom:10px}
.todo-add input{flex:1;padding:10px 14px;border:1px solid var(--glass-border);border-radius:12px;font-size:13px;outline:none;background:rgba(255,255,255,0.4);color:var(--text)}
.todo-add input::placeholder{color:var(--text-grey)}
.todo-add input:focus{border-color:var(--blue);background:rgba(255,255,255,0.6)}
.todo-add button{padding:10px 18px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px rgba(59,130,246,0.3)}
.mood-row{display:flex;gap:10px;justify-content:center;margin:12px 0}
.mood-btn{width:48px;height:48px;border-radius:50%;border:2px solid var(--glass-border);background:rgba(255,255,255,0.4);font-size:24px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.mood-btn:hover{transform:scale(1.1);background:rgba(255,255,255,0.6)}
.mood-btn.selected{border-color:var(--blue);background:rgba(59,130,246,0.15);transform:scale(1.15)}
.city-card{background:var(--glass);backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.city-card .city-name{font-size:14px;font-weight:700;color:var(--text)}
.city-card .city-info{font-size:11px;color:var(--text-grey);margin-top:2px}
.city-card .city-price{font-size:16px;font-weight:800;color:#2563eb}
textarea{width:100%;padding:10px 12px;border:1px solid var(--glass-border);border-radius:12px;font-size:13px;outline:none;resize:vertical;font-family:inherit;min-height:56px;line-height:1.5;background:rgba(255,255,255,0.4);color:var(--text)}
textarea::placeholder{color:var(--text-grey)}
textarea:focus{border-color:var(--blue);background:rgba(255,255,255,0.6)}
select{padding:8px 12px;border:1px solid var(--glass-border);border-radius:12px;font-size:13px;outline:none;background:rgba(255,255,255,0.6);color:var(--text);cursor:pointer;font-family:inherit}
select option{background:#fff;color:var(--text)}
select:focus{border-color:var(--blue)}
.btn{padding:8px 16px;border:none;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.btn-add{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;box-shadow:0 3px 12px rgba(59,130,246,0.3)}.btn-add:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(59,130,246,0.4)}
.btn-del{background:rgba(239,68,68,0.12);color:#dc2626;padding:5px 12px;font-size:11px;border:1px solid rgba(239,68,68,0.2)}.btn-del:hover{background:var(--red);color:#fff}
.btn-save{background:linear-gradient(135deg,#10b981,#059669);color:#fff}.btn-save:hover{box-shadow:0 5px 16px rgba(16,185,129,0.35)}
.btn-edit{background:rgba(255,255,255,0.4);color:var(--text-light);padding:5px 12px;font-size:11px;border:1px solid var(--glass-border)}.btn-edit:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-sm{padding:5px 12px;font-size:11px}
.fg{margin-bottom:10px}
.fg label{font-size:12px;color:var(--text-light);display:block;margin-bottom:4px;font-weight:600}
.fg input,.fg textarea,.fg select{width:100%;padding:8px 12px;border:1px solid var(--glass-border);border-radius:10px;font-size:13px;outline:none;font-family:inherit;background:rgba(255,255,255,0.4);color:var(--text)}
.fg input::placeholder,.fg textarea::placeholder{color:var(--text-grey)}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--blue);background:rgba(255,255,255,0.6)}
.fg-row{display:flex;gap:10px}.fg-row .fg{flex:1}
.sub-sec{margin-bottom:20px}
.sub-sec-t{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(0,0,0,0.06)}
.empty-hint{text-align:center;padding:26px 16px;color:var(--text-grey);font-size:12px;background:rgba(255,255,255,0.35);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px}
.client-card{background:var(--glass);backdrop-filter:var(--blur-light);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:10px;border-left:4px solid var(--text-grey);position:relative}
.client-card.grade-a{border-left-color:var(--red)}
.client-card.grade-b{border-left-color:var(--orange)}
.client-card.grade-c{border-left-color:var(--green)}
.client-card .c-name{font-size:14px;font-weight:700;color:var(--text)}
.client-card .c-info{font-size:11px;color:var(--text-light);margin-top:4px;line-height:1.6}
.client-card .c-actions{position:absolute;top:12px;right:12px;display:flex;gap:6px}

<script>
// ============ 全局工具 ============
var WEEKDAYS=['周日','周一','周二','周三','周四','周五','周六'];
var MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
var refreshOffset=0;
function todayStr(){var d=new Date();return d.getFullYear()+'年'+MONTHS[d.getMonth()]+d.getDate()+'日 '+WEEKDAYS[d.getDay()];}
function todayShort(){var d=new Date();return MONTHS[d.getMonth()]+d.getDate()+'日';}
function dayNum(){return Math.floor(Date.now()/86400000);}
function rotate(arr,count,offset){var start=(dayNum()+(offset||0)+refreshOffset)%arr.length;var r=[];for(var i=0;i<count;i++)r.push(arr[(start+i)%arr.length]);return r;}
function stars(n){var s='<span class="rating">';for(var i=1;i<=5;i++)s+=i<=n?'<span class="star-on">★</span>':'<span class="star-off">★</span>';return s+'</span>';}
function timeStr(){var d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}

// ============ 全网搜索链接 ============
var PLATFORMS=[
  {name:'抖音',url:function(q){return 'https://www.douyin.com/search/'+encodeURIComponent(q);}},
  {name:'小红书',url:function(q){return 'https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(q);}},
  {name:'B站',url:function(q){return 'https://search.bilibili.com/all?keyword='+encodeURIComponent(q);}},
  {name:'微博',url:function(q){return 'https://s.weibo.com/weibo?q='+encodeURIComponent(q);}},
  {name:'知乎',url:function(q){return 'https://www.zhihu.com/search?q='+encodeURIComponent(q);}},
  {name:'百度',url:function(q){return 'https://www.baidu.com/s?wd='+encodeURIComponent(q);}}
];
function searchBtns(kw){return '<div class="search-btns">'+PLATFORMS.map(function(p){return '<a href="'+p.url(kw)+'" target="_blank" class="search-btn">'+p.name+'</a>';}).join('')+'</div>';}

// ============ API ============
var HOT_API='https://api-hot.imsyy.top';
var HOT_SOURCES=[{key:'Douyin',name:'抖音',color:'badge-red'},{key:'Bilibili',name:'B站',color:'badge-blue'},{key:'Weibo',name:'微博',color:'badge-orange'},{key:'Zhihu',name:'知乎',color:'badge-purple'},{key:'Tieba',name:'百度',color:'badge-blue'}];
function fetchHot(s){return fetch(HOT_API+'/'+s,{signal:AbortSignal.timeout?AbortSignal.timeout(6000):undefined}).then(function(r){return r.json();}).then(function(d){return(d&&d.data)?d.data:null;}).catch(function(){return null;});}
function fetchQuote(){return fetch('https://v1.hitokoto.cn/?c=i&c=k').then(function(r){return r.json();}).catch(function(){return null;});}
function fetchWeather(){
  if(navigator.geolocation){
    return new Promise(function(resolve){
      navigator.geolocation.getCurrentPosition(
        function(pos){
          var lat=pos.coords.latitude.toFixed(2);
          var lon=pos.coords.longitude.toFixed(2);
          fetchWeatherFromWttr(lat+','+lon).then(resolve);
        },
        function(){fetchWeatherByIP().then(resolve);},
        {timeout:5000,enableHighAccuracy:false,maximumAge:600000}
      );
    });
  }
  return fetchWeatherByIP();
}
function fetchWeatherByIP(){
  return fetch('https://ipapi.co/json/',{signal:AbortSignal.timeout?AbortSignal.timeout(5000):undefined})
    .then(function(r){return r.json();})
    .then(function(loc){
      if(loc&&loc.city)return fetchWeatherFromWttr(encodeURIComponent(loc.city));
      return fetchWeatherFromWttr('');
    })
    .catch(function(){return fetchWeatherFromWttr('');});
}
function fetchWeatherFromWttr(query){
  var url='https://wttr.in/'+(query||'')+'?format=j1&lang=zh';
  return fetch(url,{signal:AbortSignal.timeout?AbortSignal.timeout(5000):undefined})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d&&d.current_condition&&d.nearest_area){
        var area=d.nearest_area[0];
        var city=area.areaName[0].value;
        if(area.region&&area.region[0].value)city=area.region[0].value;
        var desc=d.current_condition[0].lang_zh&&d.current_condition[0].lang_zh[0]?d.current_condition[0].lang_zh[0].value:d.current_condition[0].weatherDesc[0].value;
        return{city:city,temp:d.current_condition[0].temp_C,desc:desc,humidity:d.current_condition[0].humidity};
      }
      return null;
    })
    .catch(function(){return null;});
}

// ============ 房产专题 ============
var HOUSE_TOPICS=[
  {title:'降息对房价的影响分析',desc:'LPR下调后各地房贷利率调整情况，对购房成本的实际影响。',tag:'政策',color:'badge-blue'},
  {title:'一线城市限购政策松绑',desc:'北上广深最新限购政策变化，外地户籍购房资格调整。',tag:'政策',color:'badge-blue'},
  {title:'法拍房捡漏指南与风险',desc:'法拍房价格优势明显，但需注意产权、租赁、税费等隐藏风险。',tag:'攻略',color:'badge-orange'},
  {title:'公积金贷款额度提升',desc:'多地上调公积金贷款最高额度，夫妻双方可贷额度计算方式。',tag:'政策',color:'badge-blue'},
  {title:'老破小改造价值分析',desc:'核心区位老房子的改造潜力和升值空间评估。',tag:'分析',color:'badge-purple'},
  {title:'二手房议价技巧',desc:'当前买方市场下，如何有效压价、识别房东底价。',tag:'攻略',color:'badge-orange'},
  {title:'学区房政策变动影响',desc:'多校划片、教师轮岗政策对学区房价值的长期影响。',tag:'教育',color:'badge-pink'},
  {title:'新房vs二手房对比',desc:'同地段新房和二手房的优劣对比，税费、装修、得房率等维度。',tag:'分析',color:'badge-purple'},
  {title:'物业费与居住品质',desc:'不同物业费水平对应的服务差异，如何判断物业好坏。',tag:'生活',color:'badge-green'},
  {title:'房贷提前还款划算吗',desc:'利率环境下提前还款的利弊分析，等额本息vs等额本金。',tag:'理财',color:'badge-green'},
  {title:'租房vs买房决策',desc:'当前租售比下的理性选择，不同城市的购房时机判断。',tag:'分析',color:'badge-purple'},
  {title:'车位购买价值评估',desc:'小区车位价格与租金对比，产权车位和人防车位区别。',tag:'攻略',color:'badge-orange'},
  {title:'精装房验房注意事项',desc:'收房时需要重点检查的墙面、水电、门窗等关键项目。',tag:'攻略',color:'badge-orange'},
  {title:'县城房产投资风险',desc:'人口流出背景下县城房产的流动性和贬值风险。',tag:'风险',color:'badge-red'},
  {title:'商住公寓的利与弊',desc:'40年产权商住公寓价格低但税费高，适合哪些人群。',tag:'分析',color:'badge-purple'},
  {title:'共有产权房申请指南',desc:'共有产权房申请条件、流程及退出机制详解。',tag:'政策',color:'badge-blue'},
  {title:'房贷利率选择策略',desc:'固定利率vs浮动利率的选择，未来利率走势预判。',tag:'理财',color:'badge-green'},
  {title:'楼层选择的讲究',desc:'不同楼层的采光、通风、噪音差异，哪些楼层最保值。',tag:'攻略',color:'badge-orange'},
  {title:'房产税试点扩围影响',desc:'房产税扩大试点对多套房持有者的影响和应对策略。',tag:'政策',color:'badge-blue'},
  {title:'二手房装修预算规划',desc:'老房翻新重点投入区域，硬装软装预算分配建议。',tag:'生活',color:'badge-green'},
  {title:'购房资格自查清单',desc:'社保年限、户籍要求、名下房产数等购房前必须确认的事项。',tag:'攻略',color:'badge-orange'},
  {title:'期房烂尾风险评估',desc:'开发商资质、预售资金监管、楼盘施工进度等风险信号。',tag:'风险',color:'badge-red'},
  {title:'公积金提取全攻略',desc:'租房、装修、还贷等场景下的公积金提取条件和流程。',tag:'政策',color:'badge-blue'},

// ============ localStorage 工具 ============
function lsGet(key,def){try{var v=localStorage.getItem(key);return v?JSON.parse(v):(def||[]);}catch(e){return def||[];}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));return true;}catch(e){return false;}}
function lsId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ============ 数据备份（导出/导入） ============
function exportBackup(){
  var data={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    data[k]=localStorage.getItem(k);
  }
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var d=new Date();
  var ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  a.href=url;a.download='workbench-backup-'+ds+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert('✅ 已导出备份：workbench-backup-'+ds+'.json\n\n请把这个文件保存到电脑/网盘。\n以后换网址、清缓存或换设备，点「导入」选这个文件即可恢复全部数据。');
}
function importBackup(input){
  var file=input.files[0];
  if(!file){input.value='';return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      var n=0;
      for(var k in data){if(data.hasOwnProperty(k)){localStorage.setItem(k,data[k]);n++;}}
      alert('✅ 已导入 '+n+' 项数据，正在刷新...');
      location.reload();
    }catch(err){alert('❌ 导入失败：文件格式不正确，请选择之前导出的备份文件');}
  };
  reader.readAsText(file);
  input.value='';
}

// 语音播放 —— 选择最佳英语发音引擎
var _enVoice=null;
function initVoices(){
  if(!('speechSynthesis' in window))return;
  var voices=speechSynthesis.getVoices();
  if(!voices.length)return;
  // 优先选 en-US 的高质量语音
  var prefer=[
    'Google US English','Samantha','Alex','Daniel','Karen','Microsoft Aria Online (Natural) - English (United States)','Microsoft Jenny Online (Natural) - English (United States)','Ting-Ting'
  ];
  for(var i=0;i<prefer.length;i++){
    var v=voices.find(function(vx){return vx.name===prefer[i];});
    if(v){_enVoice=v;break;}
  }
  if(!_enVoice){
    _enVoice=voices.find(function(vx){return vx.lang&&vx.lang.indexOf('en')===0;})||null;
  }
}
if('speechSynthesis' in window){
  initVoices();
  speechSynthesis.onvoiceschanged=initVoices;
}
function speakText(btn,text){
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    var utter=new SpeechSynthesisUtterance(text);
    utter.lang='en-US';
    utter.rate=0.9;
    utter.pitch=1;
    if(_enVoice)utter.voice=_enVoice;
    utter.volume=1;
    btn.classList.add('playing');
    btn.textContent='⏸ 播放中...';
    utter.onend=function(){
      btn.classList.remove('playing');
      btn.textContent='🔊 再播一次';
    };
    utter.onerror=function(){
      btn.classList.remove('playing');
      btn.textContent='🔊 播放';
    };
    speechSynthesis.speak(utter);
  }else{
    alert('您的浏览器不支持语音播放功能，建议使用Chrome或Safari浏览器');
  }
}

function checkQuizAll(idx,chosen){
  if(quizAnswered[idx])return;
  quizAnswered[idx]=true;
  var quizzes=rotate(QUIZ_BANK,10,5);
  var qz=quizzes[idx];
  var opts=document.querySelectorAll('#quizBox'+idx+' .quiz-opt');
  opts.forEach(function(o){o.disabled=true;});
  if(chosen===qz.answer){
    opts[chosen].classList.add('correct');
  }else{
    opts[chosen].classList.add('wrong');
    opts[qz.answer].classList.add('correct');
  }
  document.getElementById('quizExplain'+idx).classList.add('show');
  // 检查是否全部答完
  if(quizAnswered.every(function(a){return a;})){
    var correct=0;
    quizzes.forEach(function(qz,i){
      // 简单统计：通过按钮颜色判断
      var box=document.getElementById('quizBox'+i);
      var correctBtn=box.querySelector('.quiz-opt.correct');
      var wrongBtn=box.querySelector('.quiz-opt.wrong');
      if(correctBtn&&!wrongBtn)correct++;
    });
    var scoreEl=document.getElementById('quizScore');
    var pct=Math.round(correct/10*100);
    var grade=pct>=90?'🏆 优秀！':pct>=70?'👍 不错！':pct>=50?'💪 继续努力！':'📖 多复习哦！';
    scoreEl.innerHTML='<div class="quiz-score"><div class="score-num">'+correct+'/10</div><div class="score-label">'+pct+'分 · '+grade+'</div></div>';
    scoreEl.style.display='block';
    scoreEl.scrollIntoView({behavior:'smooth',block:'center'});
  }
}

// ============ 待办功能 ============
function getTodoKey(){return 'todo_'+new Date().toISOString().slice(0,10);}
function addTodo(){
  var input=document.getElementById('todoInput');var text=input.value.trim();
  if(!text)return;
  var todos=JSON.parse(localStorage.getItem(getTodoKey())||'[]');
  todos.push({text:text,done:false});
  localStorage.setItem(getTodoKey(),JSON.stringify(todos));
  input.value='';renderTodoList();
}
function toggleTodo(idx){
  var todos=JSON.parse(localStorage.getItem(getTodoKey())||'[]');
  todos[idx].done=!todos[idx].done;
  localStorage.setItem(getTodoKey(),JSON.stringify(todos));
  renderTodoList();
}
function delTodo(idx){
  var todos=JSON.parse(localStorage.getItem(getTodoKey())||'[]');
  todos.splice(idx,1);
  localStorage.setItem(getTodoKey(),JSON.stringify(todos));
  renderTodoList();
}
function renderTodoList(){
  var todos=JSON.parse(localStorage.getItem(getTodoKey())||'[]');
  var html='';var doneCount=0;
  todos.forEach(function(t,i){
    if(t.done)doneCount++;
    html+='<div class="todo-item'+(t.done?' done':'')+'"><div class="checkbox" onclick="toggleTodo('+i+')">'+(t.done?'✓':'')+'</div><div class="todo-text" onclick="toggleTodo('+i+')">'+t.text+'</div><span class="todo-del" onclick="delTodo('+i+')">✕</span></div>';
  });
  if(!todos.length)html='<div style="text-align:center;color:var(--text-grey);font-size:12px;padding:12px">暂无待办，添加一个吧～</div>';
  var list=document.getElementById('todoList');
  if(list)list.innerHTML=html;
}
