<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#7AB8C9">
<title>我的专属工作台</title>
<style>
:root{--blue:#7AB8C9;--pink:#F4A6B8;--green:#6BCB77;--orange:#FFB562;--purple:#B19CD9;--red:#FF6B6B;--bg:#F5F7FA;--white:#FFF;--text:#2D3436;--text-light:#636E72;--text-grey:#B2BEC3;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,.06);--sidebar-w:220px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex}
.sidebar{width:var(--sidebar-w);height:100vh;background:linear-gradient(180deg,#FFF 0%,#FAFCFD 100%);border-right:1px solid #EEF2F5;display:flex;flex-direction:column;flex-shrink:0;z-index:100;transition:transform .3s}
.sidebar-header{padding:24px 18px;background:linear-gradient(135deg,#A8D8EA 0%,#7AB8C9 100%);color:#fff}
.sidebar-header .avatar{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px}
.sidebar-header h1{font-size:16px;font-weight:600}
.sidebar-header p{font-size:11px;opacity:.8;margin-top:2px}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;color:var(--text-light);font-size:13px;font-weight:500;transition:all .2s;margin-bottom:3px}
.nav-item:hover{background:#F0F4F8;color:var(--text)}
.nav-item.active{background:var(--blue);color:#fff}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.main{flex:1;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{display:none;padding:20px}
.page.active{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-header{margin-bottom:18px}
.page-header h2{font-size:20px;font-weight:700}
.page-header .date{font-size:12px;color:var(--text-grey);margin-top:3px}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;transition:transform .15s}
.card:hover{transform:translateY(-1px)}
.card-title{font-size:14px;font-weight:600;margin-bottom:6px;line-height:1.5}
.card-desc{font-size:12px;color:var(--text-light);line-height:1.6;margin-bottom:8px}
.card-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-grey);margin-bottom:8px;flex-wrap:wrap}
.badge{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600}
.badge-blue{background:#E3F4F7;color:#5A9BAB}.badge-pink{background:#FCE8EE;color:#E07B92}.badge-green{background:#E3F8E8;color:#4FAB5E}.badge-orange{background:#FFF0DD;color:#E89536}.badge-purple{background:#EFE8F7;color:#9070C4}.badge-red{background:#FDE8E8;color:#E04545}
.search-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #F0F2F5}
.search-btn{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:500;text-decoration:none;color:var(--text-light);background:#F5F7FA;transition:all .15s;border:1px solid transparent}
.search-btn:hover{color:#fff;background:var(--blue);border-color:var(--blue)}
.search-btn:nth-child(1):hover{background:#000;border-color:#000}.search-btn:nth-child(2):hover{background:#FF2442;border-color:#FF2442}.search-btn:nth-child(3):hover{background:#00A1D6;border-color:#00A1D6}.search-btn:nth-child(4):hover{background:#E6162D;border-color:#E6162D}.search-btn:nth-child(5):hover{background:#0066FF;border-color:#0066FF}.search-btn:nth-child(6):hover{background:#2932E1;border-color:#2932E1}
.loading{text-align:center;padding:30px;color:var(--text-grey);font-size:13px}
.quote-card{background:linear-gradient(135deg,#A8D8EA 0%,#7AB8C9 100%);color:#fff;border-radius:var(--radius);padding:24px;margin-bottom:16px}
.quote-card .quote-text{font-size:17px;font-weight:600;line-height:1.6;margin-bottom:8px}
.quote-card .quote-from{font-size:12px;opacity:.8}
.word-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:12px;border-left:4px solid var(--purple)}
.word-card .word-en{font-size:22px;font-weight:700;color:var(--purple)}
.word-card .word-phonetic{font-size:13px;color:var(--text-grey);margin-top:2px}
.word-card .word-cn{font-size:14px;color:var(--text);margin-top:8px;line-height:1.6}
.word-card .word-example{font-size:12px;color:var(--text-light);margin-top:8px;font-style:italic;line-height:1.6}
.word-card .word-extra{font-size:11px;color:var(--text-grey);margin-top:10px;padding-top:8px;border-top:1px dashed #E8EAED;line-height:1.8}
.word-card .word-extra b{color:var(--purple)}
.fitness-day{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border-left:4px solid var(--green)}
.fitness-day.today{border-left-color:var(--orange);background:linear-gradient(135deg,#FFF 0%,#FFF8F0 100%)}
.fitness-day .day-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.fitness-day .day-focus{font-size:12px;color:var(--text-light);margin-top:4px}
.fitness-day .day-detail{font-size:12px;color:var(--text);margin-top:8px;line-height:1.8;background:#F5F7FA;padding:10px;border-radius:8px}
.fitness-day .day-tip{font-size:11px;color:var(--orange);margin-top:6px}
.fitness-day .day-cal{font-size:11px;color:var(--green);margin-top:4px}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.summary-item{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:center;cursor:pointer;transition:transform .15s}
.summary-item:hover{transform:translateY(-2px)}
.summary-item .num{font-size:24px;font-weight:700}
.summary-item .label{font-size:11px;color:var(--text-grey);margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.tab{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;background:var(--white);color:var(--text-light);box-shadow:var(--shadow);transition:all .15s}
.tab.active{background:var(--blue);color:#fff}
.divider{font-size:13px;font-weight:600;color:var(--text-light);margin:16px 0 8px;padding-left:4px;display:flex;align-items:center;gap:6px}
.rating{display:inline-flex;gap:1px;font-size:11px}
.rating .star-on{color:var(--orange)}.rating .star-off{color:#E0E0E0}
.calc-box{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:12px}
.calc-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calc-row label{font-size:12px;color:var(--text-light);width:80px;flex-shrink:0}
.calc-row input{flex:1;padding:8px 10px;border:1px solid #E0E4E8;border-radius:8px;font-size:13px;outline:none}
.calc-row input:focus{border-color:var(--blue)}
.calc-result{background:#F5F7FA;border-radius:10px;padding:14px;margin-top:8px}
.calc-result .calc-num{font-size:22px;font-weight:700;color:var(--blue)}
.calc-result .calc-label{font-size:11px;color:var(--text-grey)}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--white);border-radius:10px;box-shadow:var(--shadow);margin-bottom:8px;cursor:pointer;transition:all .15s}
.todo-item:hover{transform:translateX(2px)}
.todo-item .checkbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;transition:all .15s}
.todo-item.done .checkbox{background:var(--blue)}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-grey)}
.todo-item .todo-text{font-size:13px;flex:1}
.todo-item .todo-del{font-size:14px;color:var(--text-grey);opacity:0;transition:opacity .15s;cursor:pointer}
.todo-item:hover .todo-del{opacity:1}
.todo-add{display:flex;gap:8px;margin-bottom:10px}
.todo-add input{flex:1;padding:8px 12px;border:1px solid #E0E4E8;border-radius:8px;font-size:13px;outline:none}
.todo-add input:focus{border-color:var(--blue)}
.todo-add button{padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.mood-row{display:flex;gap:8px;justify-content:center;margin:10px 0}
.mood-btn{width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:#F5F7FA;font-size:22px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.mood-btn:hover{transform:scale(1.1)}
.mood-btn.selected{border-color:var(--blue);background:#E3F4F7;transform:scale(1.15)}
.quiz-box{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:12px;border-left:4px solid var(--green)}
.quiz-q{font-size:14px;font-weight:600;margin-bottom:12px}
.quiz-opt{display:block;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px;border:1px solid #E0E4E8;border-radius:8px;background:var(--white);font-size:13px;cursor:pointer;transition:all .15s}
.quiz-opt:hover{border-color:var(--blue);background:#F0F7FA}
.quiz-opt.correct{border-color:var(--green);background:#E3F8E8;color:#4FAB5E}
.quiz-opt.wrong{border-color:var(--red);background:#FDE8E8;color:#E04545}
.quiz-opt:disabled{cursor:default}
.city-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.city-card .city-name{font-size:14px;font-weight:600}
.city-card .city-info{font-size:11px;color:var(--text-grey);margin-top:2px}
.city-card .city-price{font-size:16px;font-weight:700;color:var(--blue)}
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99}
.mobile-header{display:none;padding:12px 16px;background:var(--white);box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
.mobile-header .menu-btn{font-size:20px;cursor:pointer;background:none;border:none}
.mobile-header .title{font-size:15px;font-weight:600;margin-left:12px}
@media(max-width:768px){.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%)}.sidebar.open{transform:none}.mask.show{display:block}.mobile-header{display:flex;align-items:center}.page{padding:14px}.summary-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar"><div class="sidebar-header"><div class="avatar">📊</div><h1>我的工作台</h1><p id="sidebarDate"></p></div><nav class="nav"><div class="nav-item active" onclick="switchPage('house',this)"><span class="icon">🏠</span>房产热点</div><div class="nav-item" onclick="switchPage('inspire',this)"><span class="icon">💡</span>灵感</div><div class="nav-item" onclick="switchPage('hustle',this)"><span class="icon">💰</span>副业</div><div class="nav-item" onclick="switchPage('word',this)"><span class="icon">📖</span>每日单词</div><div class="nav-item" onclick="switchPage('fitness',this)"><span class="icon">🏃</span>运动计划</div><div class="nav-item" onclick="switchPage('summary',this)"><span class="icon">📝</span>每日小结</div></nav></aside>
<div class="mask" id="mask" onclick="toggleSidebar(false)"></div>
<main class="main"><div class="mobile-header"><button class="menu-btn" onclick="toggleSidebar()">☰</button><span class="title" id="mobileTitle">房产热点</span></div>
<section class="page active" id="page-house"><div class="page-header"><h2>🏠 房产热点</h2><p class="date" id="houseDate"></p></div><div class="tabs" id="houseTabs"><div class="tab active" onclick="switchHouseTab('trending',this)">全网热搜</div><div class="tab" onclick="switchHouseTab('estate',this)">房产专题</div><div class="tab" onclick="switchHouseTab('calc',this)">购房计算器</div><div class="tab" onclick="switchHouseTab('city',this)">城市速览</div></div><div id="houseContent"><div class="loading">加载中...</div></div></section>
<section class="page" id="page-inspire"><div class="page-header"><h2>💡 灵感</h2><p class="date">每日灵感 · 创意精选</p></div><div id="inspireContent"><div class="loading">加载中...</div></div></section>
<section class="page" id="page-hustle"><div class="page-header"><h2>💰 副业推荐</h2><p class="date">多渠道变现思路</p></div><div id="hustleContent"></div></section>
<section class="page" id="page-word"><div class="page-header"><h2>📖 每日单词</h2><p class="date" id="wordDate"></p></div><div id="wordContent"></div></section>
<section class="page" id="page-fitness"><div class="page-header"><h2>🏃 运动计划</h2><p class="date">每周训练安排</p></div><div id="fitnessContent"></div></section>
<section class="page" id="page-summary"><div class="page-header"><h2>📝 每日小结</h2><p class="date" id="summaryDate"></p></div><div id="summaryContent"></div></section>
</main>
<script>
// ============ 全局工具 ============
var WEEKDAYS=['周日','周一','周二','周三','周四','周五','周六'];
var MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
function todayStr(){var d=new Date();return d.getFullYear()+'年'+MONTHS[d.getMonth()]+d.getDate()+'日 '+WEEKDAYS[d.getDay()];}
function dayNum(){return Math.floor(Date.now()/86400000);}
function rotate(arr,count,offset){var start=(dayNum()+(offset||0))%arr.length;var r=[];for(var i=0;i<count;i++)r.push(arr[(start+i)%arr.length]);return r;}
function stars(n){var s='<span class="rating">';for(var i=1;i<=5;i++)s+=i<=n?'<span class="star-on">★</span>':'<span class="star-off">★</span>';return s+'</span>';}

// ============ 全网搜索链接 ============
var PLATFORMS=[
  {name:'抖音',url:function(q){return 'https://www.douyin.com/search/'+encodeURIComponent(q);}},
  {name:'小红书',url:function(q){return 'https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(q);}},
  {name:'B站',url:function(q){return 'https://search.bilibili.com/all?keyword='+encodeURIComponent(q);}},
  {name:'微博',url:function(q){return 'https://s.weibo.com/weibo?q='+encodeURIComponent(q);}},
  {name:'知乎',url:function(q){return 'https://www.zhihu.com/search?q='+encodeURIComponent(q);}},
  {name:'百度',url:function(q){return 'https://www.baidu.com/s?wd='+encodeURIComponent(q);}}
];
function searchBtns(kw){return '<div class="search-btns">'+PLATFORMS.map(function(p){return '<a href="'+p.url(kw)+'" target="_blank" class="search-btn">'+p.name+'</a>';}).join('')+'</div>';}

// ============ API ============
var HOT_API='https://api-hot.imsyy.top';
var HOT_SOURCES=[{key:'Douyin',name:'抖音',color:'badge-red'},{key:'Bilibili',name:'B站',color:'badge-blue'},{key:'Weibo',name:'微博',color:'badge-orange'},{key:'Zhihu',name:'知乎',color:'badge-purple'},{key:'Tieba',name:'百度',color:'badge-blue'}];
function fetchHot(s){return fetch(HOT_API+'/'+s,{signal:AbortSignal.timeout?AbortSignal.timeout(6000):undefined}).then(function(r){return r.json();}).then(function(d){return(d&&d.data)?d.data:null;}).catch(function(){return null;});}
function fetchQuote(){return fetch('https://v1.hitokoto.cn/?c=i&c=k').then(function(r){return r.json();}).catch(function(){return null;});}
function fetchWeather(){return fetch('https://wttr.in/?format=j1',{signal:AbortSignal.timeout?AbortSignal.timeout(5000):undefined}).then(function(r){return r.json();}).then(function(d){if(d&&d.current_condition&&d.nearest_area){return{city:d.nearest_area[0].areaName[0].value,temp:d.current_condition[0].temp_C,desc:d.current_condition[0].weatherDesc[0].value,humidity:d.current_condition[0].humidity};}return null;}).catch(function(){return null;});}

// ============ 房产专题 ============
var HOUSE_TOPICS=[
  {title:'降息对房价的影响分析',desc:'LPR下调后各地房贷利率调整情况，对购房成本的实际影响。',tag:'政策',color:'badge-blue'},
  {title:'一线城市限购政策松绑',desc:'北上广深最新限购政策变化，外地户籍购房资格调整。',tag:'政策',color:'badge-blue'},
  {title:'法拍房捡漏指南与风险',desc:'法拍房价格优势明显，但需注意产权、租赁、税费等隐藏风险。',tag:'攻略',color:'badge-orange'},
  {title:'公积金贷款额度提升',desc:'多地上调公积金贷款最高额度，夫妻双方可贷额度计算方式。',tag:'政策',color:'badge-blue'},
  {title:'老破小改造价值分析',desc:'核心区位老房子的改造潜力和升值空间评估。',tag:'分析',color:'badge-purple'},
  {title:'二手房议价技巧',desc:'当前买方市场下，如何有效压价、识别房东底价。',tag:'攻略',color:'badge-orange'},
  {title:'学区房政策变动影响',desc:'多校划片、教师轮岗政策对学区房价值的长期影响。',tag:'教育',color:'badge-pink'},
  {title:'新房vs二手房对比',desc:'同地段新房和二手房的优劣对比，税费、装修、得房率等维度。',tag:'分析',color:'badge-purple'},
  {title:'物业费与居住品质',desc:'不同物业费水平对应的服务差异，如何判断物业好坏。',tag:'生活',color:'badge-green'},
  {title:'房贷提前还款划算吗',desc:'利率环境下提前还款的利弊分析，等额本息vs等额本金。',tag:'理财',color:'badge-green'},
  {title:'租房vs买房决策',desc:'当前租售比下的理性选择，不同城市的购房时机判断。',tag:'分析',color:'badge-purple'},
  {title:'车位购买价值评估',desc:'小区车位价格与租金对比，产权车位和人防车位区别。',tag:'攻略',color:'badge-orange'},
  {title:'精装房验房注意事项',desc:'收房时需要重点检查的墙面、水电、门窗等关键项目。',tag:'攻略',color:'badge-orange'},
  {title:'县城房产投资风险',desc:'人口流出背景下县城房产的流动性和贬值风险。',tag:'风险',color:'badge-red'},
  {title:'商住公寓的利与弊',desc:'40年产权商住公寓价格低但税费高，适合哪些人群。',tag:'分析',color:'badge-purple'},
  {title:'共有产权房申请指南',desc:'共有产权房申请条件、流程及退出机制详解。',tag:'政策',color:'badge-blue'},
  {title:'房贷利率选择策略',desc:'固定利率vs浮动利率的选择，未来利率走势预判。',tag:'理财',color:'badge-green'},
  {title:'楼层选择的讲究',desc:'不同楼层的采光、通风、噪音差异，哪些楼层最保值。',tag:'攻略',color:'badge-orange'},
  {title:'房产税试点扩围影响',desc:'房产税扩大试点对多套房持有者的影响和应对策略。',tag:'政策',color:'badge-blue'},
  {title:'二手房装修预算规划',desc:'老房翻新重点投入区域，硬装软装预算分配建议。',tag:'生活',color:'badge-green'},
  {title:'购房资格自查清单',desc:'社保年限、户籍要求、名下房产数等购房前必须确认的事项。',tag:'攻略',color:'badge-orange'},
  {title:'期房烂尾风险评估',desc:'开发商资质、预售资金监管、楼盘施工进度等风险信号。',tag:'风险',color:'badge-red'},
  {title:'公积金提取全攻略',desc:'租房、装修、还贷等场景下的公积金提取条件和流程。',tag:'政策',color:'badge-blue'},

function renderHouse(){
  var c=document.getElementById('houseContent');

function calcMortgage(){
  var loan=parseFloat(document.getElementById('calLoan').value)*10000;
  var rate=parseFloat(document.getElementById('calRate').value)/100/12;
  var months=parseInt(document.getElementById('calYears').value)*12;
  if(!loan||!rate||!months)return;
  var monthly=loan*rate*Math.pow(1+rate,months)/(Math.pow(1+rate,months)-1);
  var total=monthly*months;var interest=total-loan;
  document.getElementById('calResult').style.display='block';
  document.getElementById('calMonthly').textContent='¥'+Math.round(monthly).toLocaleString();
  document.getElementById('calInterest').textContent='¥'+Math.round(interest).toLocaleString();
  document.getElementById('calTotal').textContent='¥'+Math.round(total).toLocaleString();
}

  });
  html+='<div class="divider">🧪 词汇小测验</div>'+renderQuiz(words);
  c.innerHTML=html;

function renderQuiz(words){
  var correct=words[Math.floor(Math.random()*4)];
  var wrongs=rotate(WORD_LIST.filter(function(w){return w.en!==correct.en;}),3,5);
  var opts=[correct].concat(wrongs);
  opts.sort(function(){return Math.random()-0.5;});
  var html='<div class="quiz-box"><div class="quiz-q">"'+correct.cn+'" 对应的英文单词是？</div>';
  opts.forEach(function(o){
    html+='<button class="quiz-opt" onclick="checkQuiz(this,\''+correct.en+'\',\''+o.en+'\')">'+o.en+'</button>';
  });
  html+='</div>';
  return html;
}
function checkQuiz(btn,correct,chosen){
  var opts=btn.parentElement.querySelectorAll('.quiz-opt');
  opts.forEach(function(o){o.disabled=true;});
  if(correct===chosen){btn.classList.add('correct');}
  else{btn.classList.add('wrong');opts.forEach(function(o){if(o.textContent.trim()===correct)o.classList.add('correct');});}
}

  fetchWeather().then(function(w){
    var wc=document.getElementById('weatherCard');
    if(w){wc.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:16px;font-weight:600">'+w.city+'</div><div style="font-size:12px;color:var(--text-light)">'+w.desc+'</div></div><div style="font-size:28px;font-weight:700;color:var(--blue)">'+w.temp+'°C</div></div><div style="font-size:11px;color:var(--text-grey);margin-top:8px">湿度 '+w.humidity+'%</div>';}
    else{wc.innerHTML='<div style="font-size:13px;color:var(--text-light)">天气获取失败，请稍后重试</div>';}
  });
}

// ============ 待办功能 ============
function getTodoKey(){return 'todo_'+new Date().toISOString().slice(0,10);}
function addTodo(){
  var input=document.getElementById('todoInput');var text=input.value.trim();
  if(!text)return;
  var todos=JSON.parse(localStorage.getItem(getTodoKey())||'[]');
  todos.push({text:text,done:false});
  localStorage.setItem(getTodoKey(),JSON.stringify(todos));
  input.value='';renderTodoList();
}
function toggleTodo(idx){
  var todos=JSON.parse(localStorage.getItem(getTodoKey())||'[]');
  todos[idx].done=!todos[idx].done;
  localStorage.setItem(getTodoKey(),JSON.stringify(todos));
  renderTodoList();
}
function delTodo(idx){
  var todos=JSON.parse(localStorage.getItem(getTodoKey())||'[]');
  todos.splice(idx,1);
  localStorage.setItem(getTodoKey(),JSON.stringify(todos));
  renderTodoList();
}
function renderTodoList(){
  var todos=JSON.parse(localStorage.getItem(getTodoKey())||'[]');
  var html='';var doneCount=0;
  todos.forEach(function(t,i){
    if(t.done)doneCount++;
    html+='<div class="todo-item'+(t.done?' done':'')+'"><div class="checkbox" onclick="toggleTodo('+i+')">'+(t.done?'✓':'')+'</div><div class="todo-text" onclick="toggleTodo('+i+')">'+t.text+'</div><span class="todo-del" onclick="delTodo('+i+')">✕</span></div>';
  });
  if(!todos.length)html='<div style="text-align:center;color:var(--text-grey);font-size:12px;padding:12px">暂无待办，添加一个吧～</div>';
  var list=document.getElementById('todoList');
  if(list)list.innerHTML=html;
}

// ============ 心情功能 ============
function setMood(btn,mood){
  document.querySelectorAll('.mood-btn').forEach(function(b){b.classList.remove('selected');});
  btn.classList.add('selected');
  var moodKey='mood_'+new Date().toISOString().slice(0,10);
  localStorage.setItem(moodKey,mood);
  document.getElementById('moodLabel').textContent='今天心情：'+mood;
}

// ============ 页面切换 ============
var PAGE_TITLES={house:'房产热点',inspire:'灵感',hustle:'副业',word:'每日单词',fitness:'运动计划',summary:'每日小结'};
function switchPage(page,el){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});
  if(el)el.classList.add('active');
  document.getElementById('mobileTitle').textContent=PAGE_TITLES[page]||'';
  if(window.innerWidth<=768)toggleSidebar(false);
  if(page==='house')renderHouse();
  else if(page==='inspire')renderInspire();
  else if(page==='hustle')renderHustle();
  else if(page==='word')renderWord();
  else if(page==='fitness')renderFitness();
  else if(page==='summary')renderSummary();
}
function toggleSidebar(force){
  var sb=document.getElementById('sidebar');var mask=document.getElementById('mask');
  if(force===false){sb.classList.remove('open');mask.classList.remove('show');}
  else{sb.classList.toggle('open');mask.classList.toggle('show');}
}
