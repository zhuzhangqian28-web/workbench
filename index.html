<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#7AB8C9">
<title>我的专属工作台</title>
<style>
:root {
  --blue: #7AB8C9; --pink: #F4A6B8; --green: #6BCB77;
  --orange: #FFB562; --purple: #B19CD9;
  --bg: #F5F7FA; --white: #FFF; --text: #2D3436;
  --text-light: #636E72; --text-grey: #B2BEC3;
  --radius: 14px; --shadow: 0 2px 12px rgba(0,0,0,.06);
  --sidebar-w: 220px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex}

/* Sidebar */
.sidebar{width:var(--sidebar-w);height:100vh;background:linear-gradient(180deg,#FFF 0%,#FAFCFD 100%);border-right:1px solid #EEF2F5;display:flex;flex-direction:column;flex-shrink:0;z-index:100;transition:transform .3s}
.sidebar-header{padding:24px 18px;background:linear-gradient(135deg,#A8D8EA 0%,#7AB8C9 100%);color:#fff}
.sidebar-header .avatar{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px}
.sidebar-header h1{font-size:16px;font-weight:600}
.sidebar-header p{font-size:11px;opacity:.8;margin-top:2px}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;color:var(--text-light);font-size:13px;font-weight:500;transition:all .2s;margin-bottom:3px}
.nav-item:hover{background:#F0F4F8;color:var(--text)}
.nav-item.active{background:var(--blue);color:#fff}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.nav-item.active .icon{color:#fff}

/* Main */
.main{flex:1;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{display:none;padding:20px}
.page.active{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Page header */
.page-header{margin-bottom:18px}
.page-header h2{font-size:20px;font-weight:700}
.page-header .date{font-size:12px;color:var(--text-grey);margin-top:3px}

/* Cards */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;transition:transform .15s}
.card:hover{transform:translateY(-1px)}
.card-title{font-size:14px;font-weight:600;margin-bottom:6px;line-height:1.5}
.card-desc{font-size:12px;color:var(--text-light);line-height:1.6;margin-bottom:8px}
.card-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-grey);margin-bottom:8px}
.badge{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600}
.badge-blue{background:#E3F4F7;color:#5A9BAB}
.badge-pink{background:#FCE8EE;color:#E07B92}
.badge-green{background:#E3F8E8;color:#4FAB5E}
.badge-orange{background:#FFF0DD;color:#E89536}
.badge-purple{background:#EFE8F7;color:#9070C4}
.badge-red{background:#FDE8E8;color:#E04545}

/* Search buttons */
.search-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #F0F2F5}
.search-btn{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:500;text-decoration:none;color:var(--text-light);background:#F5F7FA;transition:all .15s;border:1px solid transparent}
.search-btn:hover{color:#fff;background:var(--blue);border-color:var(--blue)}
.search-btn:nth-child(1):hover{background:#000;border-color:#000}
.search-btn:nth-child(2):hover{background:#FF2442;border-color:#FF2442}
.search-btn:nth-child(3):hover{background:#00A1D6;border-color:#00A1D6}
.search-btn:nth-child(4):hover{background:#E6162D;border-color:#E6162D}
.search-btn:nth-child(5):hover{background:#0066FF;border-color:#0066FF}
.search-btn:nth-child(6):hover{background:#2932E1;border-color:#2932E1}

/* Loading */
.loading{text-align:center;padding:30px;color:var(--text-grey);font-size:13px}
.skeleton{background:linear-gradient(90deg,#F0F2F5 25%,#E8EAED 50%,#F0F2F5 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:80px;margin-bottom:12px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Quote */
.quote-card{background:linear-gradient(135deg,#A8D8EA 0%,#7AB8C9 100%);color:#fff;border-radius:var(--radius);padding:24px;margin-bottom:16px}
.quote-card .quote-text{font-size:17px;font-weight:600;line-height:1.6;margin-bottom:8px}
.quote-card .quote-from{font-size:12px;opacity:.8}

/* Word card */
.word-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:12px;border-left:4px solid var(--purple)}
.word-card .word-en{font-size:22px;font-weight:700;color:var(--purple)}
.word-card .word-phonetic{font-size:13px;color:var(--text-grey);margin-top:2px}
.word-card .word-cn{font-size:14px;color:var(--text);margin-top:8px;line-height:1.6}
.word-card .word-example{font-size:12px;color:var(--text-light);margin-top:8px;font-style:italic;line-height:1.6}

/* Fitness */
.fitness-day{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border-left:4px solid var(--green)}
.fitness-day.today{border-left-color:var(--orange);background:linear-gradient(135deg,#FFF 0%,#FFF8F0 100%)}
.fitness-day .day-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.fitness-day .day-focus{font-size:12px;color:var(--text-light);margin-top:4px}
.fitness-day .day-detail{font-size:12px;color:var(--text);margin-top:8px;line-height:1.8;background:#F5F7FA;padding:10px;border-radius:8px}

/* Summary */
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.summary-item{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:center;cursor:pointer;transition:transform .15s}
.summary-item:hover{transform:translateY(-2px)}
.summary-item .num{font-size:24px;font-weight:700}
.summary-item .label{font-size:11px;color:var(--text-grey);margin-top:4px}

/* Tabs */
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.tab{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;background:var(--white);color:var(--text-light);box-shadow:var(--shadow);transition:all .15s}
.tab.active{background:var(--blue);color:#fff}

/* Mobile */
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99}
.mobile-header{display:none;padding:12px 16px;background:var(--white);box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
.mobile-header .menu-btn{font-size:20px;cursor:pointer;background:none;border:none}
.mobile-header .title{font-size:15px;font-weight:600;margin-left:12px}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .mask.show{display:block}
  .mobile-header{display:flex;align-items:center}
  .page{padding:14px}
  .summary-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

var WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
var MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '年' + MONTHS[d.getMonth()] + d.getDate() + '日 ' + WEEKDAYS[d.getDay()];
}
function dayNum() { return Math.floor(Date.now() / 86400000); }
function rotate(arr, count, offset) {
  var start = (dayNum() + (offset || 0)) % arr.length;
  var result = [];
  for (var i = 0; i < count; i++) result.push(arr[(start + i) % arr.length]);
  return result;
}

// ============ 渲染：房产热点 ============
var houseTab = 'trending';

function switchHouseTab(tab, el) {
  houseTab = tab;
  document.querySelectorAll('#houseTabs .tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  renderHouse();
}

function renderHouse() {
  var container = document.getElementById('houseContent');
  if (houseTab === 'trending') {
    container.innerHTML = '<div class="loading">正在获取全网热搜...</div>';
    Promise.all(HOT_SOURCES.slice(0, 3).map(function(s) { return fetchHot(s.key); })).then(function(results) {
      var html = '';
      var hasData = false;
      results.forEach(function(items, idx) {
        var src = HOT_SOURCES[idx];
        if (items && items.length) {
          hasData = true;
          html += '<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text-light)">' + src.name + '热搜 TOP5</div>';
          items.slice(0, 5).forEach(function(item, i) {
            var title = item.title || item.name || '';
            var hot = item.hot || '';
            html += '<div class="card">' +
              '<div class="card-meta"><span class="badge ' + src.color + '">' + src.name + '</span><span>🔥 #' + (i + 1) + '</span>' + (hot ? '<span>热度 ' + hot + '</span>' : '') + '</div>' +
              '<div class="card-title">' + title + '</div>' +
              searchBtns(title) +
              '</div>';
          });
          html += '</div>';
        }
      });
      if (!hasData) {
        html = renderEstateTopics();
      }
      container.innerHTML = html;
    });
  } else {
    container.innerHTML = renderEstateTopics();
  }
}

function renderEstateTopics() {
  var topics = rotate(HOUSE_TOPICS, 6, 0);
  return topics.map(function(t) {
    return '<div class="card">' +
      '<div class="card-meta"><span class="badge ' + t.color + '">' + t.tag + '</span></div>' +
      '<div class="card-title">' + t.title + '</div>' +
      '<div class="card-desc">' + t.desc + '</div>' +
      searchBtns(t.title) +
      '</div>';
  }).join('');
}

    '<div class="card-title">' + topics[0].title + '</div>' +
    '<div class="card-desc">' + topics[0].desc + '</div>' + searchBtns(topics[0].title) + '</div>';

  html += '<div class="card" style="text-align:center;color:var(--text-grey);font-size:12px">点击上方卡片可跳转到对应板块查看更多</div>';

  container.innerHTML = html;
}

// ============ 页面切换 ============
var PAGE_TITLES = { house: '房产热点', inspire: '灵感', hustle: '副业', word: '每日单词', fitness: '运动计划', summary: '每日小结' };

function switchPage(page, el, color) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  if (el) el.classList.add('active');
  document.getElementById('mobileTitle').textContent = PAGE_TITLES[page] || '';
  if (window.innerWidth <= 768) toggleSidebar(false);
  if (page === 'house') renderHouse();
  else if (page === 'inspire') renderInspire();
  else if (page === 'hustle') renderHustle();
  else if (page === 'word') renderWord();
  else if (page === 'fitness') renderFitness();
  else if (page === 'summary') renderSummary();
}

function toggleSidebar(force) {
  var sb = document.getElementById('sidebar');
  var mask = document.getElementById('mask');
  if (force === false) { sb.classList.remove('open'); mask.classList.remove('show'); }
  else { sb.classList.toggle('open'); mask.classList.toggle('show'); }
}

// ============ 初始化 ============
document.getElementById('sidebarDate').textContent = todayStr();
document.getElementById('houseDate').textContent = todayStr();
document.getElementById('wordDate').textContent = todayStr();
document.getElementById('summaryDate').textContent = todayStr();
renderHouse();
</script>
